<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Curso</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- Barra de navegação principal -->
<nav class="navbar">
    <div class="nav-container">
        <a class="nav-logo" th:href="@{/}">🏫 Sistema Escolar MVC</a>
        <ul class="nav-links">
            <li><a th:href="@{/alunos}">Alunos</a></li>
            <li><a class="active" th:href="@{/cursos}">Cursos</a></li>
            <li><a th:href="@{/matriculas}">Matrículas</a></li>
            <li><a th:href="@{/h2-console}" target="_blank">Console H2</a></li>
        </ul>
    </div>
</nav>

<main class="container estreito">
    <div th:if="${mensagemErro}" class="alerta erro" th:text="${mensagemErro}"></div>

    <header class="topo">
        <div>
            <h1 th:text="${curso.id == null ? 'Novo Curso' : 'Editar Curso'}">Novo Curso</h1>
            <p>Preencha os dados do curso.</p>
        </div>
    </header>

    <section class="card">
        <!-- ========================================== -->
        <!-- [PARTE 2] FORMULÁRIO DE CADASTRO E EDIÇÃO DE CURSO -->
        <!-- ========================================== -->
        <form th:action="@{/cursos/salvar}" th:object="${curso}" method="post" class="formulario">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="nome">Nome do Curso *</label>
                <input id="nome" type="text" th:field="*{nome}" required placeholder="Ex: Programação em Java">
            </div>

            <div class="form-group">
                <label for="descricao">Descrição (opcional)</label>
                <textarea id="descricao" th:field="*{descricao}" rows="3" placeholder="Breve resumo da ementa do curso..."></textarea>
            </div>

            <div class="form-group">
                <label for="cargaHoraria">Carga Horária (em horas) *</label>
                <input id="cargaHoraria" type="number" th:field="*{cargaHoraria}" min="1" required placeholder="Ex: 80">
            </div>

            <div class="acoes-formulario">
                <a class="botao secundario" th:href="@{/cursos}">Cancelar</a>
                <button class="botao" type="submit">Salvar Curso</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
