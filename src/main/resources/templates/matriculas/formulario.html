<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Matrícula</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- Barra de navegação principal -->
<nav class="navbar">
    <div class="nav-container">
        <a class="nav-logo" th:href="@{/}">🏫 Sistema Escolar MVC</a>
        <ul class="nav-links">
            <li><a th:href="@{/alunos}">Alunos</a></li>
            <li><a th:href="@{/cursos}">Cursos</a></li>
            <li><a class="active" th:href="@{/matriculas}">Matrículas</a></li>
            <li><a th:href="@{/h2-console}" target="_blank">Console H2</a></li>
        </ul>
    </div>
</nav>

<main class="container estreito">
    <div th:if="${mensagemErro}" class="alerta erro" th:text="${mensagemErro}"></div>

    <header class="topo">
        <div>
            <h1 th:text="${matricula.id == null ? 'Nova Matrícula' : 'Editar Matrícula'}">Nova Matrícula</h1>
            <p>Selecione o aluno e o curso para formalizar a matrícula.</p>
        </div>
    </header>

    <section class="card">
        <!-- Formulário de Matrícula -->
        <form th:action="@{/matriculas/salvar}" th:object="${matricula}" method="post" class="formulario">
            <input type="hidden" th:field="*{id}">

            <!-- Select dinâmico para seleção do Aluno -->
            <div class="form-group">
                <label for="aluno">Aluno *</label>
                <select id="aluno" th:field="*{aluno.id}" required>
                    <option value="" disabled selected>Selecione um aluno...</option>
                    <option th:each="a : ${alunos}"
                            th:value="${a.id}"
                            th:text="${a.nome + ' (RG: ' + a.rgFormatado + ')'}">
                    </option>
                </select>
            </div>

            <!-- Select dinâmico para seleção do Curso -->
            <div class="form-group">
                <label for="curso">Curso *</label>
                <select id="curso" th:field="*{curso.id}" required>
                    <option value="" disabled selected>Selecione um curso...</option>
                    <option th:each="c : ${cursos}"
                            th:value="${c.id}"
                            th:text="${c.nome + ' (' + c.cargaHoraria + 'h)'}">
                    </option>
                </select>
            </div>

            <!-- Campo de data da matrícula -->
            <div class="form-group">
                <label for="dataMatricula">Data da Matrícula *</label>
                <input id="dataMatricula" type="date" th:field="*{dataMatricula}" required>
            </div>

            <!-- Select de Status (Enum StatusMatricula) -->
            <div class="form-group" th:if="${statusList != null}">
                <label for="status">Status da Matrícula *</label>
                <select id="status" th:field="*{status}" required>
                    <option th:each="s : ${statusList}"
                            th:value="${s}"
                            th:text="${s.descricao}">
                    </option>
                </select>
            </div>

            <div class="acoes-formulario">
                <a class="botao secundario" th:href="@{/matriculas}">Cancelar</a>
                <button class="botao" type="submit">Salvar Matrícula</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
